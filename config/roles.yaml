    omit_ok: false
    can_fill: [butter, margarine, lard, vegetable oil, coconut oil, ghee]

# Tier 2 (recipebot/substitute_draft.py): the LLM drafts revised steps; code validates them. Everything it writes is labelled "prediction".
draft:
  repair_attempts: 1               # one re-ask with the validator's problems, then the draft is REJECTED (evidence-only answer is shown)
  max_extra_steps: 2               # draft may have at most this many more steps than the original
  max_step_chars: 400
  max_notes: 2                     # short hedged cautions about the role the removed ingredient played
  note_max_words: 30
  vocab_min_count: 30              # a dataset ingredient name must occur >= this often to count as a "known food" in the validator
  allow_foods: [water, salt, black pepper, pepper, ice, cooking spray]   # may be mentioned even if not in the edited list
  removal_context_words: [omit, omitted, omitting, removed, without, instead of, in place of, replace, replaced, replacing, substitute, substituted, skip, skipped, leave out, left out]
  banned_phrases: [safe, allergen free, allergy safe, guarantee, guaranteed, identical, exactly the same, taste the same, tastes the same, same taste,
    no difference, perfect, perfectly, foolproof, will work, medical, cure, cures, doctor approved]
