# Keys/values are token sequences (singularized, lowercase). Three stages:
#  pre_aliases   - BEFORE prep/soft words are dropped (protect or rewrite phrases that contain them)
#  aliases       - AFTER drops, replaces the sequence anywhere in the canon
#  exact_aliases - only when the WHOLE canon equals the key
