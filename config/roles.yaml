  soy sauce:
    roles: [salt, umami, color]
    omit_ok: false
    can_fill: [tamari, worcestershire sauce, coconut amino, fish sauce, salt, miso, teriyaki sauce]
  wine:
    roles: [acid, liquid, flavor]
    omit_ok: true
    can_fill: [chicken broth, vegetable broth, vinegar, grape juice, apple juice, lemon juice, water]
  vinegar:
    roles: [acid, flavor]
    omit_ok: false
    can_fill: [lemon juice, lime juice, wine]
  maple syrup:
    roles: [sweetener, flavor, moisture]
    omit_ok: false
    can_fill: [honey, brown sugar, sugar, agave, molasses, corn syrup]
  shortening:
